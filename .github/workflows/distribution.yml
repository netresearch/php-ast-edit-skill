name: Distribution

on:
  push:
  pull_request:
  merge_group:

permissions: {}

jobs:
  install:
    name: Install and artifacts (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: json, tokenizer, phar
          coverage: none
          tools: composer:v2
      - name: Test clone, Composer consumers, PHAR and extracted archives
        run: bash tests/distribution.sh

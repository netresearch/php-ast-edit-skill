name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

# The shared skill-repo workflow cannot run a runtime build before packaging.
# Preserve its signed-tag → checksums → Cosign → provenance → publication contract.
# Upstream: https://github.com/netresearch/skill-repo-skill/blob/main/.github/workflows/release.yml
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Verify annotated signed tag
        env:
          TAG_REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG_REF" == refs/tags/v* ]]
          REF_INFO=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_REF#refs/tags/}")
          [[ "$(jq -r '.object.type' <<< "$REF_INFO")" == tag ]]
          TAG_SHA=$(jq -r '.object.sha' <<< "$REF_INFO")
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.verification.verified' | jq -e '. == true'
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP at the supported floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: json, tokenizer, phar
          coverage: none
          tools: composer:v2
      - name: Build executable release packages
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh "$TAG_VERSION"
      - name: Test installation and the exact release artifacts
        run: bash tests/distribution.sh --artifacts dist/releases
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums
        working-directory: dist/releases
        run: cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt
      - name: Verify checksum signature
        working-directory: dist/releases
        env:
          SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --bundle SHA256SUMS.txt.sigstore.json \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/releases/*.zip
            dist/releases/*.tar.gz
            dist/releases/php-ast-edit.phar
            dist/releases/runtime-dependencies.json
            dist/releases/SHA256SUMS.txt
      - name: Publish all verified assets together
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/releases/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
